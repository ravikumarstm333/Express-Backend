<!DOCTYPE html>
<html lang="en">
<head>
    <title>SignUp Page</title>
</head>
<body>
    <div>
        <h2>SignUp</h2>
        <form id="signupform"><!-- // if not write method it default get method -->
            <!--now we post data  -->
            <label for="username">Username</label>
            <input type="text" id="username" name="username"/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password"/>
            <label for="email">Email</label>
            <input type="email" id="email" name="email"/>

            <button id="submit" type="submit">SignUp</button>
            <a href="/login">have a account</a>

        </form>
    </div>
    <script>
        const form=document.getElementById("signupform")
        form.addEventListener("submit",(event)=>{
            event.preventDefault();
            const formData=new FormData(form);
            const data=Object.fromEntries(formData);
            // console.log(data)
            fetch("http://localhost:4000/signupdata",{
                method:"POST",
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify(data)
            })
            .then(res=>res.json())
            .then(data=>{
                if(data.redirectedURL){
                    window.location.href=data.redirectedURL;
                }
            })
            .then(err=>console.log(err))
        })
    </script>
    
</body>
</html>
