<!DOCTYPE html>
<html lang="en">
<head>
    <title>SignUp Page</title>
</head>
<body>
    <div>
        <h2>SignUp</h2>
        <form action="http://localhost:4000/signupdata" method="get" enctype="application/x-www-form-urlencoded"><!-- // if not write method it default get method -->
            <label for="username">Username</label>
            <input type="text" id="username" name="username"/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password"/>
            <label for="email">Email</label>
            <input type="email" id="email" name="email"/>

            <button id="submit" type="submit">SignUp</button>
            <a href="/login">have a account</a>

        </form>
    </div>
</body>
</html>
